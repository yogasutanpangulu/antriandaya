<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Sistem - Daya Toyota</title>
    <style>
        /* Mencegah scroll di halaman utama agar iframe yang mengambil alih */
        body, html { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #f4f7f6 0%, #e2e8f0 100%);
            width: 100vw;
            height: 100vh;
            overflow: hidden; 
        }

        /* --- SIDEBAR MENU STYLES --- */
        .sidebar {
            position: fixed;
            top: 0;
            left: -260px; /* Sembunyikan sidebar di luar layar */
            width: 260px;
            height: 100vh;
            background-color: #ffffff;
            box-shadow: 4px 0 15px rgba(0,0,0,0.1);
            transition: left 0.3s ease-in-out;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }

        .sidebar-tab {
            position: absolute;
            top: 20px;
            right: -40px;
            width: 40px;
            height: 120px;
            background-color: #d9534f;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-tab .icon { font-size: 20px; margin-bottom: 10px; }
        .sidebar-tab .menu-text { transform: rotate(-90deg); letter-spacing: 2px; font-size: 14px; font-weight: bold; margin-top: 15px; }
        .sidebar:hover { left: 0; }
        
        .sidebar-header { padding: 20px; background-color: #f8f9fa; border-bottom: 1px solid #e9ecef; text-align: center; }
        .sidebar-header h2 { color: #d9534f; margin: 0; font-size: 20px; }
        
        .sidebar-menu { list-style: none; padding: 20px 0; margin: 0; flex-grow: 1; }
        .sidebar-menu li { margin: 0; }
        .sidebar-menu a { display: block; padding: 15px 25px; color: #333; text-decoration: none; font-weight: bold; font-size: 14px; border-left: 4px solid transparent; transition: all 0.2s; cursor: pointer;}
        .sidebar-menu a:hover { background-color: #f4f7f6; border-left-color: #d9534f; color: #d9534f; }

        /* --- TAMPILAN DASHBOARD PORTAL --- */
        #portal-home {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
        }

        .portal-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px; /* Dipersempit agar tabel lebih proporsional */
            width: 90%;
            margin-left: 50px; 
        }
        .portal-header h1 { color: #d9534f; margin: 0 0 10px 0; font-size: 32px; letter-spacing: 1px; }
        .portal-header p { color: #6c757d; margin: 0 0 30px 0; font-size: 16px; }

        /* Tabel Dashboard Style */
        .dashboard-card {
            background: #ffffff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 25px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .sa-queue-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 15px; 
        }
        .sa-queue-table th, .sa-queue-table td { 
            border: 1px solid #ccc; 
            padding: 12px; 
            font-size: 14px; 
            text-align: center;
        }
        .sa-queue-table th { 
            background: #f4f4f4; 
            font-weight: bold; 
        }
        .sa-queue-table tr:hover { background: #fdfdfd; }

        /* --- IFRAME (WADAH UNTUK SISTEM LAIN) --- */
        #content-frame {
            display: none; 
            width: calc(100vw - 40px); 
            height: 100vh;
            border: none;
            margin-left: 40px; 
            background: #f4f7f6;
        }

        @media (max-width: 768px) {
            .portal-container { padding: 30px 20px; margin-left: 40px;}
        }
    </style>
</head>
<body>

    <!-- 1. SIDEBAR MENU -->
    <div class="sidebar">
        <!-- Tab Merah -->
        <div class="sidebar-tab">
            <div class="icon">≡</div>
            <div class="menu-text">MENU</div>
        </div>

        <!-- Isi Menu -->
        <div class="sidebar-header">
            <img src="LOGO DAYA.webp" alt="Daya Toyota" style="max-height: 40px; margin-bottom: 10px; display: block; margin: 0 auto;">
            <h2>Sistem Bengkel</h2>
        </div>
        <ul class="sidebar-menu">
            <li><a onclick="showHome()">Dashboard Portal</a></li>
            <li><a onclick="loadPage('antrian.html')">Sistem Antrian</a></li>
            <li><a onclick="loadPage('laporan.html')">Rekap Laporan</a></li>
            <li><a onclick="loadPage('estimasi.html')">ESTIMASI</a></li>
            <li><a onclick="loadPage('flatrateservice.html')">Flat Rate Service</a></li>
            <li><a onclick="loadPage('saranteknisi.html')">Saran Teknisi & Partman</a></li>
        </ul>
    </div>

    <!-- 2. WADAH IFRAME (Untuk menampilkan file lain) -->
    <iframe id="content-frame" name="content-frame"></iframe>

    <!-- 3. KONTEN DASHBOARD AWAL -->
    <div id="portal-home">
        <div class="portal-container">
            <div class="portal-header">
                <h1>🚗 DAYA TOYOTA</h1>
                <p>Dashboard Sistem Bengkel</p>
            </div>

            <!-- Tabel Antrian Saran Teknisi -->
            <div class="dashboard-card">
                <h3 style="margin: 0 0 10px 0; font-size: 16px; color: #d32f2f; border-bottom: 2px solid #eee; padding-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    📥 Antrian Saran Teknisi (Hari Ini)
                </h3>
                <table class="sa-queue-table" id="table-sa-queue">
                    <thead>
                        <tr>
                            <th>NAMA SA</th>
                            <th>QTY SARAN</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="2" style="color:#999;">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
            
            <p style="margin-top: 30px; font-size: 12px; color: #aaa;">&copy; 2026 Daya Toyota Service System</p>
        </div>
    </div>

    <!-- SCRIPT NAVIGASI IFRAME -->
    <script>
        function loadPage(url) {
            document.getElementById('portal-home').style.display = 'none';
            document.getElementById('content-frame').style.display = 'block';
            document.getElementById('content-frame').src = url;
        }

        function showHome() {
            document.getElementById('content-frame').style.display = 'none';
            document.getElementById('content-frame').src = 'about:blank';
            document.getElementById('portal-home').style.display = 'flex';
        }
    </script>

    <!-- SCRIPT FIREBASE UNTUK TABEL DASHBOARD -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Gunakan Config Firebase dari sistem yang ada
        const firebaseConfig = {
            apiKey: "AIzaSyBHLuzqXq_T6BGACGbDdheC7w8ZEQcsqCM",
            authDomain: "penerimaan-service.firebaseapp.com",
            databaseURL: "https://penerimaan-service-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "penerimaan-service",
            storageBucket: "penerimaan-service.firebasestorage.app",
            messagingSenderId: "238520546109",
            appId: "1:238520546109:web:1e1b6c31288fd431290b54"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Fungsi Load Data Saran Teknisi
        function loadSaranTeknisiList() {
            const tbody = document.querySelector('#table-sa-queue tbody');
            const saranRef = ref(db, 'saran_siap_sa');
            
            onValue(saranRef, (snapshot) => {
                const data = snapshot.val();
                const todayStr = new Date().toDateString(); 
                let saCounts = {};

                if (data) {
                    Object.keys(data).forEach(key => {
                        const saran = data[key];
                        // Hitung hanya yang tanggalnya sama dengan hari ini
                        if (new Date(saran.timestamp).toDateString() === todayStr) {
                            const saName = saran.namaSA || "TIDAK ADA SA";
                            saCounts[saName] = (saCounts[saName] || 0) + 1;
                        }
                    });
                }
                
                tbody.innerHTML = '';
                
                // Render hasil ke tabel
                if (Object.keys(saCounts).length > 0) {
                    Object.keys(saCounts).forEach(sa => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `<td><strong>${sa}</strong></td><td>${saCounts[sa]}</td>`;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="2" style="color:#999; padding: 20px;">Belum ada antrian saran untuk hari ini.</td></tr>';
                }
            });
        }
        
        // Eksekusi fungsi
        loadSaranTeknisiList();
    </script>
</body>
</html>
